[project]
name = "stirling-e2e"
version = "0.1.0"
description = "E2E and Golden Comparison Tests for Stirling (Original vs Porting)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pytest>=8.0.0",
    "pytest-html>=4.2.0",
    "pywinauto>=0.6.9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v --junitxml=reports/report.xml --html=reports/report.html --self-contained-html"
markers = [
    # The three marks say which executables a test starts, and they do not overlap:
    # a golden test carries only "golden", so -m ported never starts the original
    # (Issue #206).
    "original: Starts Original Stirling only (analysis_target/Stirling.exe)",
    "ported: Starts StirHex only (porting/StirHex)",
    "golden: Starts both and compares their output byte for byte",
    "unit: Checks the driver itself; starts nothing",
]
